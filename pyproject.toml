[project]
name = "atlas-posthoc"
version = "0.1.0"
description = "Post-hoc diagnostics and plotting for AtlasIO.jl redistricting chains"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "polars",
    "matplotlib",
    "geopandas",
    "pyyaml",
    "tqdm",
    "scipy",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
atlas-posthoc = "atlas_posthoc.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]